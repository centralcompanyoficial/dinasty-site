<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel Dinasty</title>
<link rel="icon" href="img/icone.png">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--vazio:#1A0840;--vazio-2:#24104F;--roxo:#5700FF;--ouro:#FFD147;--claro:#F3EEFF;--claro-2:#B9AEDB;--verde:#5BF09A;--erro:#FF7A85}
*{box-sizing:border-box}
body{margin:0;background:var(--vazio);color:var(--claro);font:400 16px/1.55 Rubik,system-ui,sans-serif}
h1,h2{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-weight:900;text-transform:uppercase;line-height:.95;margin:0}
h1{font-size:48px}h2{font-size:34px;margin-bottom:16px}
.largura{width:min(1100px,100% - 32px);margin:0 auto;padding:40px 0 80px}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px;flex-wrap:wrap}
header img{height:28px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:860px){.grade{grid-template-columns:1fr}}
.bloco{background:var(--vazio-2);padding:26px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 12px;border:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#fff;font:400 15px Rubik,sans-serif}
textarea{min-height:130px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ouro)}
.lado{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:500}
.check input{width:auto}
button{border:0;padding:13px 22px;background:var(--roxo);color:#fff;font:800 18px/1 "Big Shoulders Display",sans-serif;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;margin-top:18px;clip-path:polygon(4% 0,100% 0,96% 100%,0 100%)}
button.ouro{background:var(--ouro);color:#1D1240}
button.pequeno{padding:8px 14px;font-size:15px;margin:0}
button.perigo{background:#A3253A}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
.msg{min-height:1.5em;margin-top:12px;font-weight:600}.msg.ok{color:var(--verde)}.msg.erro{color:var(--erro)}
.item{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:14px 0;border-top:1px solid rgba(255,255,255,.08)}
.item small{display:block;color:var(--claro-2)}
.acoes{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dica{color:var(--claro-2);font-size:14px;margin:6px 0 0}
#entrar{max-width:440px;margin:12vh auto}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
td,th{text-align:left;padding:6px 8px;border-top:1px solid rgba(255,255,255,.08)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="largura">

<section id="entrar" class="bloco">
  <h1>Painel Dinasty</h1>
  <p class="dica">Use a senha de admin (o segredo ADMIN_KEY do Supabase).</p>
  <form id="fEntrar">
    <label for="chave">Senha de admin</label>
    <input id="chave" type="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <div class="msg" id="mEntrar" role="status"></div>
  </form>
</section>

<div id="painel" hidden>
  <header>
    <img src="img/logo.png" alt="Dinasty">
    <div><span id="estadoDiscord" class="dica"></span> <button class="pequeno" id="sair" type="button">Sair</button></div>
  </header>

  <div class="grade">
    <section class="bloco">
      <h2>Novo anúncio</h2>
      <p class="dica">Sai na hora no jogo (aba Novidades), no site e no Discord.</p>
      <form id="fAnuncio">
        <label for="aTitulo">Título</label><input id="aTitulo" maxlength="120" required>
        <div class="lado">
          <div><label for="aTipo">Tipo</label>
            <select id="aTipo"><option value="novidade">Novidade</option><option value="atualizacao">Atualização (vai pro canal de atualizações)</option><option value="evento">Evento</option><option value="campeonato">Campeonato</option><option value="manutencao">Manutenção</option></select></div>
          <div><label for="aLink">Link (opcional)</label><input id="aLink" type="url" placeholder="https://"></div>
        </div>
        <label for="aTexto">Texto</label><textarea id="aTexto" maxlength="4000" required placeholder="Use **assim** pra negrito."></textarea>
        <label for="aImagem">Link de uma imagem (opcional)</label><input id="aImagem" type="url" placeholder="https://...png">
        <label class="check"><input id="aFixar" type="checkbox"> Fixar no topo</label>
        <button type="submit" class="ouro">Publicar em tudo</button>
        <div class="msg" id="mAnuncio" role="status"></div>
      </form>
    </section>

    <section class="bloco">
      <h2>Novo campeonato</h2>
      <p class="dica">Cria o campeonato e já publica o anúncio com as inscrições abertas.</p>
      <form id="fCamp">
        <label for="cNome">Nome</label><input id="cNome" maxlength="100" required>
        <div class="lado">
          <div><label for="cModo">Modo</label><select id="cModo"><option>battle royale</option><option>arena 1v1</option><option>arena 2v2</option><option>arena 3v3</option></select></div>
          <div><label for="cVagas">Vagas</label><input id="cVagas" type="number" min="2" max="1000" value="63"></div>
        </div>
        <div class="lado">
          <div><label for="cQuando">Começa (horário de Brasília)</label><input id="cQuando" type="datetime-local" required></div>
          <div><label for="cAte">Inscrições até (opcional)</label><input id="cAte" type="datetime-local"></div>
        </div>
        <label for="cPremio">Prêmio</label><input id="cPremio" maxlength="120">
        <label for="cDesc">Regras e descrição</label><textarea id="cDesc" maxlength="2000"></textarea>
        <label for="cImagem">Link de uma imagem (opcional)</label><input id="cImagem" type="url">
        <button type="submit" class="ouro">Criar e anunciar</button>
        <div class="msg" id="mCamp" role="status"></div>
      </form>
    </section>
  </div>

  <div class="grade" style="margin-top:24px">
    <section class="bloco">
      <h2>Anúncios no ar</h2>
      <div id="listaAnuncios"></div>
    </section>
    <section class="bloco">
      <h2>Campeonatos</h2>
      <div id="listaCamp"></div>
      <div id="inscritos"></div>
    </section>
  </div>
</div>
</div>

<script>
const SUPA = "https://drjxrhjbkqcjhhqkssvz.supabase.co";
const CHAVE = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyanhyaGpia3FjamhocWtzc3Z6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MTc4NjIsImV4cCI6MjEwNzM5Mzg2Mn0.i9HC2IL-zgO8NT35pt4PqDCxHqno8h_stEKwmGnD1rY";
const API = SUPA + "/functions/v1/dinasty-api";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = new Intl.DateTimeFormat("pt-BR", {timeZone: "America/Sao_Paulo", dateStyle: "short", timeStyle: "short"});
let senha = "";
try { senha = sessionStorage.getItem("dinasty.admin") || ""; } catch {}

function chamar(rota, metodo = "GET", corpo) {
  return fetch(API + rota, {method: metodo, headers: {"Content-Type": "application/json", apikey: CHAVE, "x-admin-key": senha}, body: corpo ? JSON.stringify(corpo) : undefined})
    .then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.erro || "Erro " + r.status); return j; });
}
const ler = (q) => fetch(SUPA + "/rest/v1/" + q, {headers: {apikey: CHAVE, Authorization: "Bearer " + CHAVE}}).then(r => r.json());
function aviso(id, texto, ok) { const m = document.getElementById(id); m.textContent = texto; m.className = "msg " + (ok ? "ok" : "erro"); }
/** "2026-10-25T20:00" (Brasília) → ISO */
const iso = (v) => v ? new Date(v + ":00-03:00").toISOString() : null;

async function entrar() {
  try {
    const r = await chamar("/verificar");
    document.getElementById("entrar").hidden = true;
    document.getElementById("painel").hidden = false;
    document.getElementById("estadoDiscord").textContent = r.discord ? "Discord ligado" : "Discord ainda sem /setup";
    try { sessionStorage.setItem("dinasty.admin", senha); } catch {}
    carregar();
  } catch (e) {
    try { sessionStorage.removeItem("dinasty.admin"); } catch {}
    if (senha) aviso("mEntrar", e.message, false);
  }
}
document.getElementById("fEntrar").onsubmit = (e) => { e.preventDefault(); senha = document.getElementById("chave").value; entrar(); };
document.getElementById("sair").onclick = () => { try { sessionStorage.removeItem("dinasty.admin"); } catch {} location.reload(); };
if (senha) entrar();

function carregar() {
  ler("anuncios?select=id,titulo,tipo,fixado,criado_em&publicado=eq.true&order=criado_em.desc&limit=30").then(l => {
    document.getElementById("listaAnuncios").innerHTML = l.length ? l.map(a =>
      `<div class="item"><div>${esc(a.titulo)}<small>${esc(a.tipo)}${a.fixado ? ", fixado" : ""}, ${fmt.format(new Date(a.criado_em))}</small></div>
       <div class="acoes"><button class="pequeno perigo" data-tirar="${a.id}">Tirar do ar</button></div></div>`).join("") : `<p class="dica">Nenhum anúncio no ar.</p>`;
    document.querySelectorAll("[data-tirar]").forEach(b => b.onclick = async () => {
      if (!confirm("Tirar esse anúncio do jogo e do site? (a mensagem no Discord continua)")) return;
      b.disabled = true; await chamar("/anuncio?id=" + b.dataset.tirar, "DELETE").catch(e => alert(e.message)); carregar();
    });
  });
  Promise.all([ler("campeonatos?select=*&order=comeca_em.desc&limit=30"), ler("campeonatos_vagas?select=id,inscritos")]).then(([cs, vs]) => {
    const n = Object.fromEntries(vs.map(v => [v.id, v.inscritos]));
    document.getElementById("listaCamp").innerHTML = cs.length ? cs.map(c =>
      `<div class="item"><div>nº ${c.id}: ${esc(c.nome)}<small>${esc(c.modo)}, ${fmt.format(new Date(c.comeca_em))}, ${n[c.id] || 0}/${c.vagas} inscritos${c.vencedor ? ", campeão: " + esc(c.vencedor) : ""}</small></div>
       <div class="acoes">
         <select data-status="${c.id}" aria-label="Situação de ${esc(c.nome)}">${["em_breve","inscricoes","em_andamento","encerrado"].map(s => `<option value="${s}" ${s === c.status ? "selected" : ""}>${{em_breve:"Em breve",inscricoes:"Inscrições abertas",em_andamento:"Acontecendo",encerrado:"Encerrado"}[s]}</option>`).join("")}</select>
         <button class="pequeno" data-ver="${c.id}">Inscritos</button>
       </div></div>`).join("") : `<p class="dica">Nenhum campeonato ainda.</p>`;
    document.querySelectorAll("[data-status]").forEach(s => s.onchange = async () => {
      const corpo = {id: +s.dataset.status, status: s.value};
      if (s.value === "encerrado") {
        const v = prompt("Quem venceu? (deixe vazio pra encerrar sem anunciar campeão)");
        if (v) corpo.vencedor = v;
      }
      await chamar("/campeonato", "PATCH", corpo).catch(e => alert(e.message)); carregar();
    });
    document.querySelectorAll("[data-ver]").forEach(b => b.onclick = async () => {
      const r = await chamar("/inscricoes?id=" + b.dataset.ver).catch(e => ({inscricoes: [], erro: e.message}));
      document.getElementById("inscritos").innerHTML = `<h2 style="margin-top:24px">Inscritos no nº ${b.dataset.ver}</h2>` + (r.inscricoes.length ?
        `<table><tr><th>Nick</th><th>Trio</th><th>Discord</th><th>Por onde</th></tr>${r.inscricoes.map(i => `<tr><td>${esc(i.nick)}</td><td>${esc(i.time_nome || "")}</td><td>${esc(i.discord || "")}</td><td>${esc(i.origem)}</td></tr>`).join("")}</table>`
        : `<p class="dica">Ninguém ainda.</p>`);
    });
  });
}

document.getElementById("fAnuncio").onsubmit = async (e) => {
  e.preventDefault();
  const b = e.submitter; b.disabled = true;
  try {
    const r = await chamar("/anuncio", "POST", {
      titulo: aTitulo.value.trim(), tipo: aTipo.value, texto: aTexto.value.trim(), link: aLink.value.trim() || null,
      imagem_url: aImagem.value.trim() || null, fixado: aFixar.checked, autor: "Equipe Dinasty",
    });
    aviso("mAnuncio", r.discord ? "Publicado no jogo, no site e no Discord." : "Publicado no jogo e no site (o Discord não respondeu).", true);
    e.target.reset(); carregar();
  } catch (err) { aviso("mAnuncio", err.message, false); }
  b.disabled = false;
};

document.getElementById("fCamp").onsubmit = async (e) => {
  e.preventDefault();
  const b = e.submitter; b.disabled = true;
  try {
    await chamar("/campeonato", "POST", {
      nome: cNome.value.trim(), modo: cModo.value, vagas: +cVagas.value, comeca_em: iso(cQuando.value), inscricoes_ate: iso(cAte.value),
      premio: cPremio.value.trim(), descricao: cDesc.value.trim(), imagem_url: cImagem.value.trim() || null,
    });
    aviso("mCamp", "Campeonato criado e anunciado em tudo.", true);
    e.target.reset(); carregar();
  } catch (err) { aviso("mCamp", err.message, false); }
  b.disabled = false;
};
</script>
</body>
</html>
